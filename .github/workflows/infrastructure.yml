name: Infrastructure

# Pull requests that touch infrastructure/ show a Terraform plan; merging to main applies it.
on:
  pull_request:
    paths:
      - "infrastructure/**"
      - ".github/workflows/infrastructure.yml"
  push:
    branches: [main]
    paths:
      - "infrastructure/**"
      - ".github/workflows/infrastructure.yml"

permissions:
  contents: read

defaults:
  run:
    shell: bash
    working-directory: infrastructure

jobs:
  plan:
    # Pull requests from forks get no GCP access, so they are skipped.
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    environment: sandbox
    # A newer push to the same pull request replaces its older plan.
    concurrency:
      group: terraform-plan-${{ github.event.number }}
      cancel-in-progress: true
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    env:
      TF_IN_AUTOMATION: "true"
      TF_VAR_project_id: ${{ vars.GCP_PROJECT_ID }}
      TF_VAR_region: ${{ vars.GCP_REGION }}
      TF_VAR_local_secret_readers: ${{ secrets.LOCAL_SECRET_READERS }}
      # The secrets were created by hand before the first apply; Terraform adopts them (see imports.tf).
      TF_VAR_adopt_existing_secrets: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_wrapper: false

      - name: Format check
        run: terraform fmt -check -recursive

      - name: Init
        run: >
          terraform init -input=false
          -backend-config="bucket=${{ vars.GCP_PROJECT_ID }}-tfstate"
          -backend-config="prefix=terraform/state"

      - name: Validate
        run: terraform validate

      - name: Test (offline, mocked provider)
        run: terraform test

      - name: Plan
        run: terraform plan -no-color -input=false -lock-timeout=5m 2>&1 | tee plan.txt

      - name: Comment the plan on the pull request
        if: always()
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const fs = require('fs');
            const file = 'infrastructure/plan.txt';
            const plan = fs.existsSync(file) ? fs.readFileSync(file, 'utf8') : 'No plan output: an earlier step failed.';
            const marker = '<!-- terraform-plan -->';
            // GitHub comments are limited to 65536 characters; keep the end, where the summary is.
            const body = `${marker}\n### Terraform plan (sandbox)\n\`\`\`\n${plan.slice(-60000)}\n\`\`\``;
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number });
            const existing = comments.find((comment) => comment.body?.startsWith(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }

  apply:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: sandbox
    # Its own group, and never cancelled: a plan queued later must not replace a pending apply.
    # The Terraform state lock already serialises plans and applies.
    concurrency:
      group: terraform-sandbox-apply
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    env:
      TF_IN_AUTOMATION: "true"
      TF_VAR_project_id: ${{ vars.GCP_PROJECT_ID }}
      TF_VAR_region: ${{ vars.GCP_REGION }}
      TF_VAR_local_secret_readers: ${{ secrets.LOCAL_SECRET_READERS }}
      # The secrets were created by hand before the first apply; Terraform adopts them (see imports.tf).
      TF_VAR_adopt_existing_secrets: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_wrapper: false

      - name: Init
        run: >
          terraform init -input=false
          -backend-config="bucket=${{ vars.GCP_PROJECT_ID }}-tfstate"
          -backend-config="prefix=terraform/state"

      - name: Validate
        run: terraform validate

      - name: Test (offline, mocked provider)
        run: terraform test

      - name: Apply
        run: terraform apply -auto-approve -input=false -lock-timeout=5m
