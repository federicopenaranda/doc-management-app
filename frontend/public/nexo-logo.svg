<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 180" role="img" aria-label="Nexo">
  <defs>
    <linearGradient id="ribbon" x1="20" y1="20" x2="95" y2="110" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1b5fc4" />
      <stop offset="0.55" stop-color="#1b7fc4" />
      <stop offset="1" stop-color="#2fcaa2" />
    </linearGradient>
    <linearGradient id="x-stroke" x1="0" y1="40" x2="38" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2fcaa2" />
      <stop offset="1" stop-color="#1b9fc4" />
    </linearGradient>
  </defs>

  <!-- Mark: a ribbon shaped like an N, pages stacked behind its right side, and pixels dissolving away -->
  <g transform="translate(28 0)">
    <g fill="none" stroke="#0b2d6b" stroke-width="3.5" stroke-linejoin="round">
      <rect x="72" y="16" width="28" height="94" rx="2" />
      <rect x="78" y="12" width="28" height="94" rx="2" />
      <rect x="84" y="8" width="28" height="94" rx="2" />
    </g>
    <path
      d="M26 112V44C26 22 52 18 64 38L84 100"
      fill="none"
      stroke="url(#ribbon)"
      stroke-width="24"
      stroke-linejoin="round"
    />
    <g>
      <rect x="116" y="22" width="7" height="7" fill="#2fcaa2" />
      <rect x="124" y="32" width="7" height="7" fill="#6adbbf" />
      <rect x="116" y="34" width="7" height="7" fill="#1b7fc4" />
      <rect x="122" y="46" width="7" height="7" fill="#2fcaa2" />
      <rect x="114" y="48" width="5" height="5" fill="#1b5fc4" />
    </g>
  </g>

  <!-- Wordmark: NEXO, drawn as shapes so it looks the same everywhere -->
  <g transform="translate(17 130)">
    <path d="M0 40V0H10L26 24V0H36V40H26L10 16V40Z" fill="#0b2d6b" />
    <path d="M44 0H72V9H54V15.5H69V24.5H54V31H72V40H44Z" fill="#0b2d6b" />
    <g transform="translate(80 0)">
      <path d="M0 0H12L38 40H26Z" fill="#0b2d6b" />
      <path d="M26 0H38L12 40H0Z" fill="url(#x-stroke)" />
    </g>
    <circle cx="146" cy="20" r="15" fill="none" stroke="#0b2d6b" stroke-width="10" />
  </g>
</svg>
