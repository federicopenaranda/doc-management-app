server {
  listen 8080;
  server_name _;
  # Redirects carry no host or port of their own: behind Cloud Run nginx does not know the public ones.
  absolute_redirect off;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  # Runtime configuration written at container start (docker/40-app-config.sh). It changes without a
  # new build, so it must never be cached.
  location = /config.json {
    alias /tmp/app-config/config.json;
    default_type application/json;
    add_header Cache-Control "no-store" always;
  }

  # The app asks for config.json relative to its base href (/es/ or /en/), so every copy serves the same file.
  location ~ ^/(?:en|es)/config\.json$ {
    alias /tmp/app-config/config.json;
    default_type application/json;
    add_header Cache-Control "no-store" always;
  }

  # Angular's build outputs carry a content hash in their name, so they can be cached for a year.
  location ~* \.(?:js|css)$ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  # One build per language (/en/ and /es/). Client-side routes fall back to that copy's index.html,
  # which must be revalidated on every visit.
  location ~ ^/(?<language>en|es)(?:/|$) {
    try_files $uri /$language/index.html;
    add_header Cache-Control "no-cache";
  }

  # No language in the address (the root, an old bookmark): Spanish is the default, the route is kept.
  location / {
    return 302 /es$request_uri;
  }
}
