server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  # Runtime configuration written at container start (docker/40-app-config.sh). It changes without a
  # new build, so it must never be cached.
  location = /config.json {
    alias /tmp/app-config/config.json;
    default_type application/json;
    add_header Cache-Control "no-store" always;
  }

  # Angular's build outputs carry a content hash in their name, so they can be cached for a year.
  location ~* \.(?:js|css)$ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  # Client-side routes fall back to index.html, which must be revalidated on every visit.
  location / {
    try_files $uri /index.html;
    add_header Cache-Control "no-cache";
  }
}
