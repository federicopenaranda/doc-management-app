<main class="mx-auto flex max-w-xl flex-col items-center gap-4 p-8">
  <h1 class="text-2xl font-medium">Hello, {{ title() }}</h1>

  <button matButton="filled" type="button" [disabled]="loading()" (click)="sayHello()">
    Say hello to the API
  </button>

  <p role="status" class="min-h-6 text-lg">{{ message() }}</p>
  @if (error()) {
    <p role="alert" class="text-red-700">{{ error() }}</p>
  }
</main>

<router-outlet />
