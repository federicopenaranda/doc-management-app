<h2 mat-dialog-title i18n>Preferences</h2>
<mat-dialog-content>
  <mat-form-field class="w-full">
    <mat-label i18n>Language</mat-label>
    <mat-select [value]="shown()" (selectionChange)="pick($event.value)">
      <mat-option value="en">English</mat-option>
      <mat-option value="es">Español</mat-option>
    </mat-select>
  </mat-form-field>
  @if (failed()) {
    <p role="alert" class="text-red-800" i18n>Could not save the language</p>
  }
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button matButton type="button" (click)="ref.close()" i18n>Close</button>
  <button matButton="filled" type="button" [disabled]="!changed()" (click)="accept()" i18n>
    Accept
  </button>
</mat-dialog-actions>
