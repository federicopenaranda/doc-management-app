<section class="mx-auto flex max-w-xl flex-col items-center gap-4 p-8">
  <h1 class="text-2xl font-medium" i18n>Hello, {{ title() }}</h1>

  <button matButton="filled" type="button" [disabled]="loading()" (click)="sayHello()" i18n>
    Say hello to the API
  </button>

  <a matButton="outlined" routerLink="/upload" i18n>Upload documents</a>

  <p role="status" class="min-h-6 text-lg">{{ message() }}</p>
  @if (error()) {
    <p role="alert" class="text-red-700">{{ error() }}</p>
  }
</section>
