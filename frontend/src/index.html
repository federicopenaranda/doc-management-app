<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>DocManagement</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/icon?family=Material+Symbols+Outlined"
      rel="stylesheet"
    />
    <script>
      // A logged-in user whose saved language is the other copy's (/en/ or /es/) is sent there before anything
      // loads. Same key as AuthService. The dev server has no prefix, so it never moves.
      try {
        var language = sessionStorage.getItem('dms.language');
        var copy = location.pathname.match(/^\/(en|es)(?=\/|$)/);
        if ((language === 'en' || language === 'es') && copy && copy[1] !== language) {
          location.replace(
            '/' +
              language +
              location.pathname.slice(copy[0].length) +
              location.search +
              location.hash,
          );
        }
      } catch (e) {}
    </script>
    <script>
      // Apply the saved light/dark choice before first paint (same key as ThemeService).
      try {
        var t = localStorage.getItem('dms-theme');
        if (t === 'light' || t === 'dark') document.documentElement.style.colorScheme = t;
      } catch (e) {}
    </script>
  </head>
  <body>
    <dms-root></dms-root>
  </body>
</html>
